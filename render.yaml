# Render Blueprint for the NutriPlan API (Node.js + Express).
# Render → New → Blueprint → select this repo. Secret values are entered in the dashboard.
services:
  - type: web
    name: nutriplan-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # e.g. https://nutriplan.vercel.app
